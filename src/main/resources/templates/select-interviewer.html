<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Interviewer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav><div class="brand">Mock Interview Platform</div><div><a href="/">Home</a></div></nav>

<main class="container">
    <h1>Select Interviewer</h1>
    <p>Request: <strong th:text="${request.requestId}"></strong></p>

    <div class="interviewer-grid">
        <div class="interviewer card" th:each="i : ${interviewers}">
            <h2 th:text="${i.name}"></h2>
            <p th:text="${i.role + ' • ' + i.experienceYears}"></p>
            <p><strong>Skills:</strong> <span th:text="${#strings.listJoin(i.skills, ', ')}"></span></p>
            <form th:action="@{'/requests/' + ${request.requestId} + '/select-interviewer'}" method="post">
                <input type="hidden" name="interviewerId" th:value="${i.id}">
                <button class="button" type="submit">Select Interviewer</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
