spring.application.name=mock-interview-request-platform

# Local development uses H2 so no database server is required.
spring.datasource.url=jdbc:h2:file:./data/mockinterview;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload-dir=uploads/resumes

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.thymeleaf.cache=false
server.port=8006
